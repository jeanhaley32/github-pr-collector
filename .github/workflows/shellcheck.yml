name: shellcheck

# severity=warning, not shellcheck's default, and the reason is not guessable
# from the code: at default severity this repo's open PR #1 (the command-
# injection fix) FAILS on SC2016 "expressions don't expand in single quotes".
# In that line the single-quoted printf format is the fix — the shell must not
# expand it, and the untrusted value is passed as an argument. A default-severity
# gate would turn a correct security fix red.
#
# Checked both directions before committing: at warning level the fix branch
# exits 0, while SC2115, SC2154 and SC2071 still exit 1. A gate that passes
# everything is worse than no gate.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck --version
          shopt -s nullglob
          files=(*.sh scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"; exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}"
